[package]
name = "greendev-manager"
version = "1.0.0"
description = "Windows green development environment manager"
authors = ["GreenDev"]
edition = "2021"
default-run = "greendev-manager"

[lib]
name = "greendev_manager_lib"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
quick-xml = "0.41"
toml = "0.9"
semver = "1"
