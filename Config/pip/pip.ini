# Frameworks pip config (CN mirror)
# Authoritative copy: D:\Frameworks\Config\pip\pip.ini
# Deployed to: %APPDATA%\pip\pip.ini
# Keep this file ASCII-only: pip reads it with the ANSI codepage (cp936) on Windows.

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
timeout = 60
cache-dir = D:\Frameworks\Caches\pip

[install]
trusted-host = pypi.tuna.tsinghua.edu.cn
