# Frameworks pip config (CN mirror)
# Authoritative copy: %FRAMEWORKS_HOME%\Config\pip\pip.ini
# Reference config; dev-shell supplies matching PIP_* environment variables.
# Keep this file ASCII-only: pip reads it with the ANSI codepage (cp936) on Windows.

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
timeout = 60
# Cache location is supplied by PIP_CACHE_DIR to avoid a fixed drive letter.

[install]
trusted-host = pypi.tuna.tsinghua.edu.cn
