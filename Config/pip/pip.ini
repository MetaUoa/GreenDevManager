# Frameworks 绿色环境 pip 配置（国内镜像）
# 权威副本: D:\Frameworks\Config\pip\pip.ini
# 生效方式二选一：
#   1. 环境变量 PIP_INDEX_URL（dev-shell.bat / env-setup.bat 已设置，推荐，随环境走）
#   2. 拷贝本文件到 %APPDATA%\pip\pip.ini（全局生效，不依赖环境脚本）

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
timeout = 60

[install]
trusted-host = pypi.tuna.tsinghua.edu.cn
