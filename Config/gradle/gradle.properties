# Frameworks 绿色环境 Gradle 用户配置（国内优化 + 代理兜底）
# 权威副本: D:\Frameworks\Config\gradle\gradle.properties
# 生效位置: %GRADLE_USER_HOME%\gradle.properties
# 即: D:\Frameworks\Caches\Gradle\gradle.properties

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh

systemProp.file.encoding=UTF-8
systemProp.http.keepAlive=true
systemProp.sun.net.http.retryCount=3

# 代理兜底：国内镜像（阿里云/腾讯/华为）直连，境外源（google/mavenCentral/gradle.org）走本机代理
# 代理停用时改端口或注释掉下面 5 行即可
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.aliyuncs.com|*.tencent.com|*.myqcloud.com|*.huaweicloud.com|*.163.com|*.ustc.edu.cn|*.tsinghua.edu.cn

# wrapper 发行包无法全局改 distributionUrl，慢时靠上面的代理即可；
# 也可在各项目 gradle-wrapper.properties 中改为:
# https://mirrors.cloud.tencent.com/gradle/gradle-8.14.5-bin.zip
