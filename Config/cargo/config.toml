# Frameworks 绿色环境 Cargo 配置（国内镜像）
# 权威副本: %FRAMEWORKS_HOME%\Config\cargo\config.toml
# 生效位置: %CARGO_HOME%\config.toml
# 即: %FRAMEWORKS_HOME%\Toolchains\Rust\cargo-home\config.toml
# 构建输出目录由 CARGO_TARGET_DIR 设置，避免在配置中固化盘符。

[net]
git-fetch-with-cli = true

# crates.io 替换为字节跳动 rsproxy（含 sparse 索引，速度快）
# 停用镜像：注释掉 [source.crates-io] 的 replace-with 一行即可
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"
